services:
  localstack:
    image: localstack/localstack:latest
    container_name: b2b-localstack
    volumes:
      - "./docker/localstack/init:/etc/localstack/init/ready.d"
    ports:
      - "4567:4566"
    environment:
      - SERVICES=sqs
      - AWS_DEFAULT_REGION=us-east-1
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:?LOCALSTACK_AUTH_TOKEN is required}
      - LOCALSTACK_SSL_NO_VERIFY=1